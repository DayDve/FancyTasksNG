name: Nightly Build

# Uploads a build from develop as a workflow artifact (NOT a GitHub Release -
# no public release page, no tag, no notification noise; just downloadable
# from this workflow run's Actions page, requires a GitHub login). For
# testers who want a develop build without building from source themselves.
# Only fires when a push actually touches something that ends up in the
# built plasmoid (or the build pipeline that produces it) - doc/workflow-only
# changes don't trigger a rebuild.
#
# The embedded version is git-describe based (see resolve_display_version in
# tools/functions.sh), so a build's artifact traces back to the exact commit
# it was built from.

on:
  push:
    branches: [develop]
    paths:
      - 'package/**'
      - 'tools/translate/languages/**'
      - 'tools/build.sh'
      - 'tools/compile_messages.sh'
      - 'tools/extract_messages.sh'
      - 'tools/functions.sh'
  workflow_dispatch:

jobs:
  nightly:
    name: Build nightly artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext zip

      - name: Build Plasmoid
        id: build
        run: |
          make build
          echo "version=$(git describe --tags)" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FancyTasksNG-${{ steps.build.outputs.version }}
          path: release/FancyTasksNG.plasmoid
          retention-days: 14
