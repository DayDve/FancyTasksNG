name: Create Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  create-release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext zip jq

      - name: Build Plasmoid
        run: |
          make build

      - name: Prepare Release Asset
        id: asset
        run: |
          VERSION=$(jq -r '.KPlugin.Version' package/metadata.json)
          ASSET_NAME="FancyTasksNG.plasmoid"
          mv release/FancyTasksNG.plasmoid "$ASSET_NAME"
          echo "asset_path=$ASSET_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          awk -v ver="[${VERSION}]" '/^## / { if (index($0, ver) > 0) { flag = 1; next } else if (flag) { flag = 0 } } flag' CHANGELOG.md > release_notes.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.asset.outputs.asset_path }}
          name: Release ${{ github.ref_name }}
          body_path: release_notes.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to KDE Store
        id: kde_store
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KDE_STORE_USER: ${{ secrets.KDE_STORE_USER }}
          KDE_STORE_PASSWORD: ${{ secrets.KDE_STORE_PASSWORD }}
        run: |
          pip install --quiet requests
          python3 .github/scripts/publish_kde_store.py \
            --version "${{ steps.asset.outputs.version }}" \
            --file "${{ steps.asset.outputs.asset_path }}" \
            --changelog-file release_notes.txt

      - name: Notify on KDE Store publish failure
        if: failure() && steps.kde_store.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="⚠️ *FancyTasksNG*: KDE Store publish failed for release \`${{ github.ref_name }}\`.
          GitHub Release itself was created fine — only the store.kde.org listing update failed.
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
